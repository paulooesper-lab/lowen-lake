<title>Lowen Lake</title>
<meta name="description" content="Lowen Lake: o universo, os personagens, os locais e o portfólio de arte. Encomendas abertas.">

<body class="home">

  <section class="painel" id="cidade"></section>
  <section class="painel" id="personagens"></section>

      <button type="button" class="botao-icone" id="mapa-fechar" aria-label="X">×</button>

  </div>
  <div class="mapa-grande-area" id="mapa-grande-area"></div>
